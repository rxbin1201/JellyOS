# JellyOS boot configuration
# Installed as /boot/boot.cfg on the EFI system partition.
# See docs/architecture/boot-configuration.md.

[boot]
default=JellyOS
timeout=5
menu=auto
recovery=Recovery
fallback_kernel=/boot/kernels/kernel-previous.elf
max_attempts=3

[entry JellyOS]
kernel=/boot/kernels/kernel-current.elf
# initrd=/boot/initrd/current.img   (initramfs arrives in Phase 7)
cmdline="loglevel=info"

[entry Recovery]
kernel=/boot/kernels/kernel-current.elf
# initrd=/boot/initrd/recovery.img
cmdline="recovery=1"

[entry SafeMode]
kernel=/boot/kernels/kernel-current.elf
# initrd=/boot/initrd/minimal.img
cmdline="safe_mode=1"
