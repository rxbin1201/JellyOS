# JellyOS boot configuration
# Installed as /boot/boot.cfg on the EFI system partition.
# See docs/architecture/boot-configuration.md.

[boot]
default=JellyOS
timeout=5
menu=auto
recovery=Recovery
fallback_kernel=/boot/kernels/kernel-previous.elf
max_attempts=3

# igpu=native: with Intel graphics of generation 9 the kernel's driver switches to the monitor's own
# resolution and best refresh rate. amdgpu=native: the same with AMD graphics of Ryzen 4000/5000 G
# processors (amdgpu=on: the driver without a mode switch at the start). Without such a GPU the options do nothing.
[entry JellyOS]
kernel=/boot/kernels/kernel-current.elf
initrd=/boot/initrd/current.img
cmdline="loglevel=info igpu=native amdgpu=native"

# As JellyOS, and the kernel log is written to the USB stick every two seconds (kernel.log): for problems after
# which nothing can be read or typed any more. (amdgpu=native,trace adds every register access of the video BIOS.)
[entry JellyOSLog]
kernel=/boot/kernels/kernel-current.elf
initrd=/boot/initrd/current.img
cmdline="loglevel=info igpu=native amdgpu=native logfile=/volumes/usb0p1/kernel.log"

# The screen exactly as the firmware set it up (if the mode switch above gives no picture).
[entry FirmwareGrafik]
kernel=/boot/kernels/kernel-current.elf
initrd=/boot/initrd/current.img
cmdline="loglevel=info"

[entry Recovery]
kernel=/boot/kernels/kernel-current.elf
initrd=/boot/initrd/current.img
cmdline="recovery=1"

[entry SafeMode]
kernel=/boot/kernels/kernel-current.elf
initrd=/boot/initrd/current.img
cmdline="safe_mode=1"
