# JellyOS boot configuration
# Installed as /boot/boot.cfg on the EFI system partition.
# See docs/architecture/boot-configuration.md.

[boot]
default=JellyOS
timeout=5
menu=auto
recovery=Recovery
fallback_kernel=/boot/kernels/kernel-previous.elf
max_attempts=3

# igpu=native: with Intel graphics of generation 9 the kernel's driver switches to the monitor's own
# resolution and best refresh rate. Without such a GPU the option does nothing.
[entry JellyOS]
kernel=/boot/kernels/kernel-current.elf
initrd=/boot/initrd/current.img
cmdline="loglevel=info igpu=native"

# The screen exactly as the firmware set it up (if the mode switch above gives no picture).
[entry FirmwareGrafik]
kernel=/boot/kernels/kernel-current.elf
initrd=/boot/initrd/current.img
cmdline="loglevel=info"

[entry Recovery]
kernel=/boot/kernels/kernel-current.elf
initrd=/boot/initrd/current.img
cmdline="recovery=1"

[entry SafeMode]
kernel=/boot/kernels/kernel-current.elf
initrd=/boot/initrd/current.img
cmdline="safe_mode=1"
