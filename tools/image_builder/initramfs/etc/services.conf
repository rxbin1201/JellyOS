# JellyOS services, read by /sbin/servicemanager.
#
# [service NAME]
# description=...
# command=PROGRAM ARGUMENTS...
# type=simple|oneshot        oneshot: runs to completion before its dependents start
# restart=always|on-failure|never
# depends=NAME ...
# control=yes                gets the service manager's control channel (startup handle 3)
# essential=yes              started in safe mode (safe_mode=1)

[service motd]
description=Show the message of the day
command=/bin/cat /etc/motd
type=oneshot
restart=never
essential=yes

[service network]
description=Network configuration (DHCP or /etc/network.conf)
command=/sbin/networkd
restart=on-failure

[service display]
description=Display server: windows, compositor, input (/etc/display.conf)
command=/sbin/displayd
restart=on-failure

[service audio]
description=Audio server: mixer and volume for all programs (/etc/audio.conf)
command=/sbin/audiod
restart=on-failure

[service shell]
description=Interactive shell on the console
command=/bin/sh
depends=motd
restart=always
control=yes
essential=yes
