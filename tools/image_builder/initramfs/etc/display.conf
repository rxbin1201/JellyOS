# Display server settings (/sbin/displayd)
#
# keymap=us|de          keyboard layout
# autostart=PROGRAM     started once the server runs (repeatable)
# mode=WIDTHxHEIGHT[@HZ]  screen mode, if the graphics driver can switch (written when one is
#                       chosen in Settings; see the list with the command: display)

keymap=de
autostart=/sbin/login
